<!doctype html><html><head><meta charset="utf-8"><title>Player settings remote test</title><style>body{background:#090d12;color:white;font:28px Arial}#playerwrapper{position:fixed;inset:0}#player{height:100%}#state{position:absolute;bottom:10vh;left:8vw}.jw-icon-settings{position:absolute;bottom:5vh;right:5vw;font:24px Arial}</style></head><body><div id="playerwrapper"><div id="player" class="jwplayer" tabindex="0" role="application" aria-label="Fixture player"><button class="jw-icon-settings" aria-label="Native settings gear">⚙</button><output id="state">Subtitles: English · Quality: Auto</output></div></div><script src="../src/player-ui.js"></script><script>var caption=1,quality=0;function draw(){document.getElementById('state').textContent='Subtitles: '+(caption?'English':'Off')+' · Quality: '+(quality?'1080p':'Auto');}var fake={getCaptionsList:function(){return [{label:'Off'},{label:'English'}];},getCurrentCaptions:function(){return caption;},setCurrentCaptions:function(v){caption=v;draw();},getQualityLevels:function(){return [{label:'Auto'},{label:'1080p'}];},getCurrentQuality:function(){return quality;},setCurrentQuality:function(v){quality=v;draw();}};var controls=FTV_PLAYER_UI.attach(document.getElementById('playerwrapper'),function(){return fake;});document.addEventListener('keydown',function(e){if(controls.handleKey(e)){e.preventDefault();e.stopImmediatePropagation();}},true);</script></body></html>
